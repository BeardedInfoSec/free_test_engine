<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Splunk Flashcard Trainer</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #f1f1f1;
      margin: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      background-color: #1e1e1e;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 10px rgba(0,0,0,0.3);
    }
    .sidebar button {
      margin-bottom: 10px;
      padding: 10px;
      background-color: #2c2c2c;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }
    .sidebar button:hover {
      background-color: #444;
    }
    .question-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 15px;
      overflow-y: auto;
      flex-grow: 1;
    }
    .question-nav div {
      position: relative;
      width: 28px;
      height: 28px;
      text-align: center;
      line-height: 28px;
      border-radius: 50%;
      background-color: #444;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }
    .correct-marker { background-color: green !important; }
    .incorrect-marker { background-color: red !important; }
    .unanswered-marker { background-color: #777 !important; }
    .selected-marker { box-shadow: 0 0 0 2px white inset; }
    .flagged-marker::after {
      content: '⚑';
      position: absolute;
      font-size: 12px;
      color: orange;
      top: -4px;
      right: -2px;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      overflow-y: auto;
    }
    .card {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 30px;
      max-width: 850px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    #question {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .choices button {
      display: block;
      margin: 12px 0;
      padding: 12px;
      background-color: #2c2c2c;
      color: white;
      border: none;
      border-radius: 5px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: background 0.3s;
    }
    .choices button.correct { background-color: green !important; }
    .choices button.incorrect { background-color: red !important; }
    .choices button.selected { background-color: #0066ff !important; }
    .choices button:hover { background-color: #3a3a3a; }
    .explanation {
      margin-top: 15px;
      font-style: italic;
      color: #bbb;
    }
    .status-bar {
      margin-top: 10px;
      color: #ccc;
      font-size: 14px;
    }
    .nav-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .nav-buttons button {
      padding: 10px 20px;
      font-size: 14px;
      background-color: #333;
      border: none;
      border-radius: 5px;
      color: white;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <input type="file" id="questionFileInput" accept=".json" />
    <button onclick="startTest()">Test Mode (T)</button>
    <button onclick="startLearn()">Learn Mode (L)</button>
    <button onclick="startSmartStudy()">Smart Study Mode (S)</button>
    <button onclick="retryMissed()">Retry Missed (R)</button>
    <button onclick="finishTest()" id="finishBtn" style="display:none">Finish Test (F)</button>
    <button onclick="resetProgress()">Reset Progress</button>
    <div class="question-nav" id="questionNav"></div>
  </div>

  <div class="main-content">
    <div class="card" id="card">
      <div id="question">Loading...</div>
      <div class="choices" id="choices"></div>
      <label><input type="checkbox" id="flagCheck" onchange="toggleFlag()"> Flag Question</label>
      <div class="nav-buttons">
        <button onclick="prevQuestion()">Back</button>
        <button onclick="nextQuestion()">Next</button>
      </div>
      <div class="explanation" id="explanation"></div>
      <div class="status-bar">
        <div id="timer"></div>
        <div id="score"></div>
      </div>
    </div>
  </div>

  <script>
    let questions = [], current = 0, correct = new Set(), missed = [], answeredStatus = [], flags = [], startTime, timerId, mode = "learn";

    function loadQuestionsFromFile(file) {
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          questions = JSON.parse(e.target.result);
          answeredStatus = Array(questions.length).fill('unanswered');
          flags = Array(questions.length).fill(false);
          startLearn();
        } catch (err) {
          alert("Invalid JSON file: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    document.getElementById("questionFileInput").addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (file) loadQuestionsFromFile(file);
    });

    function displayQuestion() {
      const q = questions[current];
      document.getElementById("question").innerText = q.question;
      const choices = document.getElementById("choices");
      const explanation = document.getElementById("explanation");
      explanation.innerText = "";
      choices.innerHTML = "";
      document.getElementById("flagCheck").checked = flags[current];

      q.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.innerText = choice;
        if (answeredStatus[current] === 'correct' || answeredStatus[current] === 'incorrect') {
          if (choice.startsWith(q.answer)) btn.classList.add("correct");
          else if (btn.innerText === choice && mode === 'learn' && !choice.startsWith(q.answer)) btn.classList.add("incorrect");
        }
        btn.onclick = () => {
          document.querySelectorAll(".choices button").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          if (answeredStatus[current] === 'unanswered') {
            if (choice.startsWith(q.answer)) {
              btn.classList.add("correct");
              answeredStatus[current] = 'correct';
              correct.add(q.question);
            } else {
              if (mode === "test") btn.classList.add("selected");
              else btn.classList.add("incorrect");
              answeredStatus[current] = 'incorrect';
              missed.push(q);
            }
            updateScore();
            updateNavStatus();
            if (mode !== "test") {
              explanation.innerText = "Explanation: " + (q.explanation || "None provided.");
            }
          }
        };
        choices.appendChild(btn);
      });
    }

    function updateNavStatus() {
      const nav = document.getElementById("questionNav");
      nav.innerHTML = "";
      answeredStatus.forEach((status, idx) => {
        const marker = document.createElement("div");
        marker.innerText = idx + 1;
        marker.classList.add(`${status}-marker`);
        if (flags[idx]) marker.classList.add("flagged-marker");
        if (idx === current) marker.classList.add("selected-marker");
        marker.onclick = () => {
          current = idx;
          displayQuestion();
        };
        nav.appendChild(marker);
      });
    }

    function updateScore() {
      document.getElementById("score").innerText = `Score: ${correct.size} / ${questions.length}`;
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const left = Math.max(0, 5400 - elapsed); // 90 mins
      const min = String(Math.floor(left / 60)).padStart(2, '0');
      const sec = String(left % 60).padStart(2, '0');
      document.getElementById("timer").innerText = `Time Left: ${min}:${sec}`;
    }

    function startTest() {
      mode = "test";
      current = 0;
      correct.clear();
      missed = [];
      answeredStatus.fill('unanswered');
      flags.fill(false);
      startTime = Date.now();
      clearInterval(timerId);
      timerId = setInterval(updateTimer, 1000);
      document.getElementById("finishBtn").style.display = "block";
      updateScore();
      updateNavStatus();
      displayQuestion();
    }

    function startLearn() {
      mode = "learn";
      current = 0;
      correct.clear();
      missed = [];
      answeredStatus.fill('unanswered');
      flags.fill(false);
      clearInterval(timerId);
      document.getElementById("timer").innerText = "";
      document.getElementById("finishBtn").style.display = "none";
      updateScore();
      updateNavStatus();
      displayQuestion();
    }

    function startSmartStudy() {
      mode = "smart";
      questions = questions.filter(q => !correct.has(q.question)).slice(0, 10);
      current = 0;
      answeredStatus = Array(questions.length).fill('unanswered');
      flags = Array(questions.length).fill(false);
      displayQuestion();
      updateNavStatus();
    }

    function retryMissed() {
      if (!missed.length) return alert("No missed questions.");
      questions = [...missed];
      current = 0;
      answeredStatus = Array(questions.length).fill('unanswered');
      flags = Array(questions.length).fill(false);
      displayQuestion();
      updateNavStatus();
    }

    function finishTest() {
      clearInterval(timerId);
      alert(`Test Complete! Score: ${correct.size} / ${questions.length}`);
    }

    function resetProgress() {
      correct.clear();
      missed = [];
      answeredStatus.fill('unanswered');
      flags.fill(false);
      updateScore();
      updateNavStatus();
      alert("Progress reset.");
    }

    function toggleFlag() {
      flags[current] = !flags[current];
      updateNavStatus();
    }

    function nextQuestion() {
      if (current < questions.length - 1) current++;
      displayQuestion();
      updateNavStatus();
    }

    function prevQuestion() {
      if (current > 0) current--;
      displayQuestion();
      updateNavStatus();
    }

    document.addEventListener('keydown', function(e) {
      const key = e.key.toLowerCase();
      if (key === 't') startTest();
      else if (key === 'l') startLearn();
      else if (key === 's') startSmartStudy();
      else if (key === 'r') retryMissed();
      else if (key === 'f') finishTest();
      else if (['a','b','c','d'].includes(key)) {
        const idx = key.charCodeAt(0) - 97;
        const buttons = document.querySelectorAll(".choices button");
        if (buttons[idx]) buttons[idx].click();
      }
    });
  </script>
</body>
</html>
