<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Splunk Flashcard Trainer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sidebar">
    <input type="file" id="questionFileInput" accept=".json" />
    <button onclick="startTest()">Test Mode (T)</button>
    <button onclick="startLearn()">Learn Mode (L)</button>
    <button onclick="startSmartStudy()">Smart Study Mode (S)</button>
    <button onclick="retryMissed()">Retry Missed (R)</button>
    <button onclick="finishTest()" id="finishBtn" style="display:none">Finish Test (F)</button>
    <button onclick="resetProgress()">Reset Progress</button>
    <div class="question-nav" id="questionNav"></div>
  </div>

  <div class="main-content">
    <div class="card" id="card">
      <div id="question">Loading...</div>
      <div class="choices" id="choices"></div>
      <label><input type="checkbox" id="flagCheck" onchange="toggleFlag()"> Flag Question</label>
      <div class="nav-buttons">
        <button onclick="prevQuestion()">Back</button>
        <button onclick="nextQuestion()">Next</button>
      </div>
      <div class="explanation" id="explanation"></div>
      <div class="status-bar">
        <div id="timer"></div>
        <div id="score"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
